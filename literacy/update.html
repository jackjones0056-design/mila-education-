<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Updating Literacy Mission</title>
  <style>
    body{margin:0;background:#f4f8f7;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:520px;background:white;border:1px solid #d6e5e1;border-radius:24px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(17,24,39,.08)}
    h1{margin:0 0 10px;font-size:2rem}p{line-height:1.5;color:#667085}.spinner{width:42px;height:42px;border:5px solid #e4ecea;border-top-color:#0f766e;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Updating Literacy Mission</h1>
    <p id="status">Clearing old Literacy and shared app caches…</p>
  </main>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(k=>
            k.startsWith('kindergarten-literacy-mission') ||
            k.startsWith('mila-learning-missions') ||
            k.startsWith('kindergarten-math-mission')
          ).map(k=>caches.delete(k)));
        }
        status.textContent='Update complete. Opening the newest Literacy Mission…';
      }catch(e){
        status.textContent='Cache reset attempted. Opening Literacy Mission…';
      }
      setTimeout(()=>location.replace('./?fresh='+Date.now()),650);
    })();
  </script>
</body>
</html>
